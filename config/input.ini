# Restart the game after editing. No gameplay commands are added.
[input]
mode = Native
mouse_sensitivity = 1.0
controller_cursor_speed = 220
controller_deadzone = 0.18
wheel_up = None
wheel_down = None
# Absolute mouse coordinates use exact viewport mapping, without acceleration.
# Values above 1 (up to 4) amplify absolute distance from the viewport center.
# Use mode = PS1Compatible for the unchanged original virtual-pad input path.

[bindings]
Primary = Key/Return, Key/Space, Mouse/Left, Pad/south
Secondary = Mouse/Right, Pad/east
Square = Key/Z, Pad/west
Triangle = Key/C, Pad/north
Menu = Key/Tab
Back = Key/Escape
CursorUp = Key/Up, Key/W, Pad/dpup
CursorDown = Key/Down, Key/S, Pad/dpdown
CursorLeft = Key/Left, Key/A, Pad/dpleft
CursorRight = Key/Right, Key/D, Pad/dpright
L1 = Key/Q, Pad/leftshoulder
R1 = Key/E, Pad/rightshoulder
L2 = Key/1, Axis/left_trigger
R2 = Key/3, Axis/right_trigger
Start = Key/F10, Pad/start
Select = Key/Backspace, Pad/back
L3 = Pad/leftstick
R3 = Pad/rightstick
